<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Switcher</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main>
  <h1>Tab Switcher</h1>
  <p class="starter-note">Student starter: read README.md and complete the TODOs.</p>
<button onclick="showTab('profile')">Profile</button>
<button onclick="showTab('skills')">Skills</button>
<button onclick="showTab('projects')">Projects</button>

<div id="profile" class="panel">
    Student Profile
</div>

<div id="skills" class="panel" style="display:none">
    HTML, CSS, JavaScript
</div>

<div id="projects" class="panel" style="display:none">
    Student Projects
</div>
</main>
</body>
</html>
