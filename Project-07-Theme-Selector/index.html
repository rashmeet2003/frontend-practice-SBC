<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme Color Selector</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main>
  <h1>Theme Color Selector</h1>
  <p class="starter-note">Student starter: read README.md and complete the TODOs.</p>
<button
    class="color-btn"
    data-color="red"
    onclick="changeColor(this)">
    Red
</button>

<button
    class="color-btn"
    data-color="blue"
    onclick="changeColor(this)">
    Blue
</button>

<button
    class="color-btn"
    data-color="green"
    onclick="changeColor(this)">
    Green
</button>

<div id="preview"></div>
</main>
</body>
</html>
